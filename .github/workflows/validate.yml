name: Validate Skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify Python baseline
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 13), sys.version'

      - name: Install Python validation dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Install validation dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Validate repository
        run: ./scripts/validate_repo.sh
